<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favors of Fortune Raids</title>
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-brand">
      <div>
        <div class="brand-kicker">EverQuest</div>
        <div class="brand-title">Favors of Fortune Raids</div>
      </div>
    </div>
    <nav id="navList" aria-label="Raid tiers"></nav>
  </aside>
  <main id="content">
    <article id="writeup" class="writeup">
      <p class="loading">Loading raid writeups…</p>
    </article>
  </main>
  <aside id="spell-panel" aria-label="Spell details">
    <div class="spell-panel-kicker">Spell</div>
    <div id="spell-card" aria-live="polite">
      <p class="spell-panel-empty">Hover a spell in the writeup to see its details.</p>
    </div>
  </aside>
</div>
<script src="js/app.js"></script>
</body>
</html>
